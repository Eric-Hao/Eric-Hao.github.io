<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "url": {{ site.url | jsonify }},
  "jobTitle": "Research Engineer",
  "worksFor": {
    "@type": "Organization",
    "name": "Kuaishou Technology",
    "url": "https://ir.kuaishou.com/",
    "department": {
      "@type": "Organization",
      "name": "Kling AI",
      "url": "https://kling.ai/"
    }
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "Peking University",
    "url": "https://en.pku.edu.cn/"
  },
  "description": {{ site.description | jsonify }},
  "image": {{ "/images/eric-hao.jpg" | absolute_url | jsonify }},
  "sameAs": [
    {{ site.author.googlescholar | jsonify }},
    {{ site.author.dblp | jsonify }},
    {{ "https://github.com/" | append: site.author.github | jsonify }}
  ]
}
</script>
